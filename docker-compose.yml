services:
  db:
    image: mariadb:11.4
    container_name: wpsdevbox-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wpsdevbox}
      MYSQL_USER: ${DB_USER:-wpsdevbox}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_strong_password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - wpsdevbox

  wordpress:
    image: wordpress:php8.3-fpm
    container_name: wpsdevbox-php
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-wpsdevbox}
      DB_USER: ${DB_USER:-wpsdevbox}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
    networks:
      - wpsdevbox

  nginx:
    image: nginx:1.27-alpine
    container_name: wpsdevbox-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wpsdevbox

volumes:
  db_data:

networks:
  wpsdevbox:
    driver: bridge
